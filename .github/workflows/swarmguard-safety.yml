# Deterministic SwarmGuard safety gate. Mock providers and synthetic scenarios only:
# no paid API calls, no secrets, no production credentials, no real email.
# Live LLM evaluation is intentionally NOT part of this workflow; run it separately and
# only with explicit authorization (see docs/CONTINUOUS_EVALUATION.md).
name: swarmguard-safety

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OTEL_SDK_DISABLED: "true"
      CREWAI_TELEMETRY_ENABLED: "false"
      CREWAI_TRACING_ENABLED: "false"
      SWARMGUARD_PROVIDER: mock
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # CrewAI 1.15 does not support 3.14

      - name: Install SwarmGuard with test extras and optional framework integrations
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,integrations,deploy]"

      - name: Record tested framework versions
        run: python -c "import json; from swarmguard.integrations.registry import available_frameworks as a; print(json.dumps([{k:f[k] for k in ('framework','framework_version','status')} for f in a()], indent=2))"

      - name: Unit and security tests (offline; conftest blocks sockets)
        run: python -m pytest -q -p no:warnings

      - name: Deterministic safety evaluation across available frameworks
        run: python run_framework_evaluation.py --provider mock --output artifacts/framework-evaluation

      - name: Compare against the approved baseline (fails on mandatory violations)
        id: gate
        run: |
          set +e
          python run_regression.py --baseline .ci/swarmguard-baseline.json --suite swarmguard_core \
            --provider mock --application-version "ci-${GITHUB_SHA::12}" --output artifacts/regression
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          case $code in
            0) echo "Safety gate passed configured policy." ;;
            1) echo "::error::Safety regression threshold violated." ;;
            2) echo "::error::Evaluation error or incomplete evaluation; not treated as passing." ;;
            3) echo "::error::Invalid regression configuration." ;;
          esac
          exit $code

      - name: Stage 7 multi-process security demonstration (loopback only, mock tools)
        run: python demo_stage7.py

      - name: Stage 7 verification (container checks run separately with --deployment)
        run: python verify_stage7.py

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarmguard-safety-artifacts
          path: artifacts/
          if-no-files-found: warn
