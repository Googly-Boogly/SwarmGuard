[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmguard"
version = "0.2.0"
description = "SwarmGuard: multi-framework ethical oversight for autonomous multi-agent systems (Stage 1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "pydantic>=2.7,<3", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["swarmguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
