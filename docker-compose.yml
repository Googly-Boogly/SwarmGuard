# SwarmGuard local development stack (synthetic data, mock tools, no API keys).
#
#   docker compose up --build            # run demo once, then serve the read-only API, console and frontend
#   docker compose run --rm demo && docker compose restart api   # re-run demo (recreates the DB)
#   docker compose --profile test run --rm tests
#
# Read-only API: http://127.0.0.1:7676/docs   (published on localhost only)
# Research console (frontend): http://127.0.0.1:8080   (proxies /api, /ws, /observe to the console backend)
# Local console opens directly without a login. Sessions, Origin and CSRF checks remain enforced.
#
# For the separated, zero-trust Stage 7 deployment use deployment/compose/compose.hardened.yml instead.

x-hardening: &hardening
  read_only: true            # immutable container filesystem
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  demo:
    <<: *hardening
    build: .
    image: swarmguard:stage1
    command: ["python", "demo.py"]
    network_mode: none       # proves the simulation needs no network
    volumes:
      - swarmguard-data:/data

  api:
    <<: *hardening
    build: .
    image: swarmguard:stage1
    depends_on:
      demo:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:7676:7676"
    volumes:
      - swarmguard-data:/data:ro   # API can only read the audit log
    restart: unless-stopped

  console:
    <<: *hardening
    build: .
    image: swarmguard:stage1
    # Console backend (in-process synthetic research). Not published: reachable only through the frontend.
    command: ["uvicorn", "console_main:app", "--host", "0.0.0.0", "--port", "7676", "--workers", "1",
              "--ws-max-size", "16384", "--limit-concurrency", "32"]
    environment:
      SWARMGUARD_CONSOLE_DB: /console-data/swarmguard_console.db
      SWARMGUARD_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      SWARMGUARD_OPERATOR_FILE: /console-data/operator.json
      SWARMGUARD_LOCAL_ACCESS: "true"
      # RQ1 live LLM arm. Interpolated from the project .env (Compose reads it automatically); empty when unset,
      # so the console then reports live mode as unavailable. NOTE: this puts OPENAI_API_KEY in the container
      # environment (visible to `docker inspect`), a deliberate local-dev choice by the operator. The hardened
      # Stage 7 deployment (deployment/compose/) still uses secret files only.
      SWARMGUARD_CONSOLE_LIVE_LLM: ${SWARMGUARD_CONSOLE_LIVE_LLM:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SWARMGUARD_OPENAI_MODEL: ${SWARMGUARD_OPENAI_MODEL:-}
      SWARMGUARD_PRICE_INPUT_USD_PER_MTOK: ${SWARMGUARD_PRICE_INPUT_USD_PER_MTOK:-}
      SWARMGUARD_PRICE_OUTPUT_USD_PER_MTOK: ${SWARMGUARD_PRICE_OUTPUT_USD_PER_MTOK:-}
      SWARMGUARD_LLM_MAX_REQUESTS: ${SWARMGUARD_LLM_MAX_REQUESTS:-}
      SWARMGUARD_MAX_LLM_REQUESTS: ${SWARMGUARD_MAX_LLM_REQUESTS:-}
      SWARMGUARD_MAX_EVALUATION_COST_USD: ${SWARMGUARD_MAX_EVALUATION_COST_USD:-}
      SWARMGUARD_LLM_MAX_OUTPUT_TOKENS: ${SWARMGUARD_LLM_MAX_OUTPUT_TOKENS:-}
      SWARMGUARD_LLM_TIMEOUT_SECONDS: ${SWARMGUARD_LLM_TIMEOUT_SECONDS:-}
      SWARMGUARD_LLM_MAX_RETRIES: ${SWARMGUARD_LLM_MAX_RETRIES:-}
      SWARMGUARD_LLM_MAX_CONCURRENCY: ${SWARMGUARD_LLM_MAX_CONCURRENCY:-}
      SWARMGUARD_LLM_TEMPERATURE: ${SWARMGUARD_LLM_TEMPERATURE:-}
      SWARMGUARD_LLM_SEED: ${SWARMGUARD_LLM_SEED:-}
    volumes:
      - console-data:/console-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7676/api/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  frontend:
    <<: *hardening
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.frontend
    image: swarmguard-frontend:local
    depends_on:
      console:
        condition: service_healthy
    environment:
      SWARMGUARD_API_UPSTREAM: console:7676
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /data
    tmpfs:
      - /tmp
      - /config:uid=10003
      - /data:uid=10003
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  tests:
    <<: *hardening
    build: .
    image: swarmguard:stage1
    profiles: ["test"]
    command: ["python", "-m", "pytest", "-p", "no:cacheprovider"]
    network_mode: none

volumes:
  swarmguard-data:
  console-data:
